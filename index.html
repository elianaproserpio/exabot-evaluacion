<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCEyT | ExaBot</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <main class="chat-container">
    <section class="chat-header">
      <div class="chat-header-info">

      <h1>ExaBot</h1>
      <p>Asistente virtual de la FCEyT</p>

      </div>
<!-- sonido y temas -->
<div class="header-buttons">
  <button id="soundBtn" class="prefs-btn sound-btn" title="Sonido de respuesta" aria-label="Activar o silenciar el sonido"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
  <button id="prefsBtn" class="prefs-btn" title="Preferencias" aria-label="Abrir preferencias" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff" stroke="none"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
</div>
    </section>

    <!-- Panel de preferencias: se abre/cierra con el ⚙️ (no se apila) -->
    <section id="prefsPanel" class="prefs-panel" hidden aria-label="Preferencias de visualización">
      <div class="prefs-row">
        <span class="prefs-label">🌗 Tema</span>
        <div class="prefs-options" data-group="theme">
          <button type="button" data-value="light">☀️ Claro</button>
          <button type="button" data-value="dark">🌙 Oscuro</button>
        </div>
      </div>
      <div class="prefs-row">
        <span class="prefs-label">🔔 Sonido de respuesta</span>
        <div class="prefs-options" data-group="sound">
          <button type="button" data-value="on">🔊 Activado</button>
          <button type="button" data-value="off">🔇 Silenciado</button>
        </div>
      </div>
      <div class="prefs-row">
        <span class="prefs-label">🔤 Tamaño de texto</span>
        <div class="prefs-options" data-group="fontsize">
          <button type="button" data-value="peq">Pequeño</button>
          <button type="button" data-value="med">Mediano</button>
          <button type="button" data-value="gra">Grande</button>
        </div>
      </div>
      <div class="prefs-footer">
        <button type="button" id="prefsReset" class="prefs-reset">♻️ Restablecer</button>
        <button type="button" id="prefsClose" class="prefs-close">Cerrar</button>
      </div>
    </section>


    

    <section class="chat-messages" id="chatMessages">
      <div class="msg-row bot">
        <div class="avatar"><img src="imagenes/exabot_avatar.png" alt="ExaBot"></div>
        <div class="message bot">
          👋 ¡Hola! Soy <b>ExaBot</b>, el asistente virtual de la Facultad de Ciencias Exactas y Tecnologías. ¿En qué puedo ayudarte? 
          <br>Elige una opción:
        </div>
      </div>

      <div class="quick-buttons">
        <button data-message="menu_profesores">👩‍🏫 Buscar un profesor</button>
        <button data-message="menu_examenes">📝 Saber sobre exámenes finales</button>
        <button data-message="menu_correlativas">📚 Consultar mis materias y correlativas </button>
   

    <div class="quick-buttons-hint">
        💬 Tambien puedes escribir tu consulta en el chat.
    </div>
   
      </div>
    </section>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="chatInput" placeholder="Escribí tu consulta..." autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </main>

<script src="js/script.js?v=3"></script>

</body>
</html>
